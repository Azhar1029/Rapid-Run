server:
  port: 8082

spring:
  application:
    name: project-service
  datasource:
    url: jdbc:mysql://localhost:3306/rapidrun_projects?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${userdb}
    password: ${passdb}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${jwtSecret}

logging:
  level:
    com.rapidrun: DEBUG
